[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loops-opencode"
version = "0.2.0"
description = "Portable loop runner and TUI for opencode long-running objectives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.80",
]

[project.scripts]
loops-opencode = "loops_opencode.cli:main"
loops-opencode-tui = "loops_opencode.tui:main"

[tool.setuptools.packages.find]
where = ["src"]
